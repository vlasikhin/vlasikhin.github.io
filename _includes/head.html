<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>
    {%- if page.title -%}
      {{ page.title }}
    {%- else -%}
      {{ site.title }}
    {%- endif -%}
  </title>

  <meta name="description" content="Pavel Vlasikhin — Backend Engineer. Ruby / Go, AI-assisted development. Independent contractor available for remote work worldwide." />
  <meta name="author" content="Pavel Vlasikhin" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}" />
  <meta property="og:description" content="Backend Engineer · Ruby / Go · AI-assisted development. Independent contractor, remote worldwide." />
  <meta property="og:url" content="{{ site.url }}" />
  <meta property="og:image" content="{{ site.url }}/icon-512.png" />

  <link rel="canonical" href="{{ site.url }}{{ page.url }}" />

  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png' | relative_url }}" />
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16.png' | relative_url }}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}" />
  <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}" />
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Pavel Vlasikhin",
    "url": "{{ site.url }}",
    "jobTitle": "Backend Engineer",
    "description": "Independent contractor specializing in backend software development (Ruby, Ruby on Rails, Go) and AI-assisted development workflows.",
    "knowsAbout": ["Ruby", "Ruby on Rails", "Go", "PostgreSQL", "Docker", "AWS", "AI-assisted development", "Claude Code", "LLM agents"],
    "sameAs": [
      "https://github.com/vlasikhin",
      "https://linkedin.com/in/vlasikhin"
    ]
  }
  </script>
</head>
