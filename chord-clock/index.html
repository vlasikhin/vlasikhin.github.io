<script id="theory">
const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const NATURAL_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const ROOT_NAMES = {
  major: ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'],
  minor: ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'G#', 'A', 'Bb', 'B'],
};
const ENHARMONIC = {
  'C#': 'Db', 'Db': 'C#', 'D#': 'Eb', 'Eb': 'D#', 'F#': 'Gb',
  'Gb': 'F#', 'G#': 'Ab', 'Ab': 'G#', 'A#': 'Bb', 'Bb': 'A#',
};

const CHORD_TYPES = [
  { name: 'maj',     symbol: '',        degrees: ['1', '3', '5'],             semis: [0, 4, 7] },
  { name: 'm',       symbol: 'm',       degrees: ['1', 'b3', '5'],            semis: [0, 3, 7] },
  { name: '7',       symbol: '7',       degrees: ['1', '3', '5', 'b7'],       semis: [0, 4, 7, 10] },
  { name: 'maj7',    symbol: 'maj7',    degrees: ['1', '3', '5', '7'],        semis: [0, 4, 7, 11] },
  { name: 'm7',      symbol: 'm7',      degrees: ['1', 'b3', '5', 'b7'],      semis: [0, 3, 7, 10] },
  { name: 'm(maj7)', symbol: 'm(maj7)', degrees: ['1', 'b3', '5', '7'],       semis: [0, 3, 7, 11] },
  { name: 'add9',    symbol: 'add9',    degrees: ['1', '3', '5', '9'],        semis: [0, 4, 7, 14] },
  { name: 'm(add9)', symbol: 'm(add9)', degrees: ['1', 'b3', '5', '9'],       semis: [0, 3, 7, 14] },
  { name: 'maj9',    symbol: 'maj9',    degrees: ['1', '3', '5', '7', '9'],   semis: [0, 4, 7, 11, 14] },
  { name: 'm9',      symbol: 'm9',      degrees: ['1', 'b3', '5', 'b7', '9'], semis: [0, 3, 7, 10, 14] },
  { name: 'sus2',    symbol: 'sus2',    degrees: ['1', '2', '5'],             semis: [0, 2, 7] },
  { name: 'sus4',    symbol: 'sus4',    degrees: ['1', '4', '5'],             semis: [0, 5, 7] },
  { name: 'dim',     symbol: 'dim',     degrees: ['1', 'b3', 'b5'],           semis: [0, 3, 6] },
  { name: 'aug',     symbol: 'aug',     degrees: ['1', '3', '#5'],            semis: [0, 4, 8] },
];

function degreeSteps(degree) {
  return (Number(degree.replace(/\D/g, '')) - 1) % 7;
}

function pcOf(name) {
  const accidental = name[1] === '#' ? 1 : name[1] === 'b' ? -1 : 0;
  return (NATURAL_PC[name[0]] + accidental + 12) % 12;
}

function rootName(rootPc, type, useAlt) {
  const name = (type.degrees.includes('b3') ? ROOT_NAMES.minor : ROOT_NAMES.major)[rootPc];
  return useAlt && ENHARMONIC[name] ? ENHARMONIC[name] : name;
}

function spellTone(root, rootPc, degree, semi) {
  const letter = LETTERS[(LETTERS.indexOf(root[0]) + degreeSteps(degree)) % 7];
  const pc = (rootPc + semi) % 12;
  const accidental = ((pc - NATURAL_PC[letter] + 18) % 12) - 6;
  if (accidental === 0) return letter;
  if (accidental === 1) return letter + '#';
  if (accidental === -1) return letter + 'b';
  return ROOT_NAMES.major[pc];
}

function spellChord(root, type) {
  const rootPc = pcOf(root);
  return type.degrees.map((degree, i) => spellTone(root, rootPc, degree, type.semis[i]));
}

function gaps(semis) {
  const positions = semis.map(s => s % 12).sort((a, b) => a - b);
  return positions.map((p, i) => (positions[i + 1] ?? 12) - p);
}

function canCompare(type) {
  return type.degrees.some(d => d === '3' || d === 'b3') && type.degrees.includes('5');
}

function flippedSymbol(symbol) {
  if (symbol.startsWith('m') && !symbol.startsWith('maj')) {
    return symbol.slice(1).replace(/^\((.*)\)$/, '$1');
  }
  return /^(maj|add)/.test(symbol) ? `m(${symbol})` : 'm' + symbol;
}

function flipThird(type) {
  const degrees = type.degrees.map(d => (d === '3' ? 'b3' : d === 'b3' ? '3' : d));
  const semis = type.semis.map((s, i) => (degrees[i] === '3' ? 4 : degrees[i] === 'b3' ? 3 : s));
  return { symbol: flippedSymbol(type.symbol), degrees, semis };
}

function selfTest() {
  let failed = 0;
  const check = (ok, message) => {
    console.assert(ok, message);
    if (!ok) failed++;
  };

  const cases = [
    ['C', 'maj', 'C E G'],
    ['C', 'm', 'C Eb G'],
    ['A', 'm7', 'A C E G'],
    ['F', 'm', 'F Ab C'],
    ['F#', 'm', 'F# A C#'],
    ['Bb', '7', 'Bb D F Ab'],
    ['Eb', 'maj7', 'Eb G Bb D'],
    ['C', 'm(maj7)', 'C Eb G B'],
    ['D', 'm9', 'D F A C E'],
    ['G', 'sus4', 'G C D'],
    ['Db', 'maj', 'Db F Ab'],
    ['C#', 'm', 'C# E G#'],
    ['G#', 'm7', 'G# B D# F#'],
  ];
  for (const [root, typeName, expected] of cases) {
    const type = CHORD_TYPES.find(t => t.name === typeName);
    const actual = spellChord(rootName(pcOf(root), type, false), type).join(' ');
    check(actual === expected, `${root}${type.symbol}: ${actual}, ожидалось ${expected}`);
  }

  check(gaps([0, 4, 7]).join(' ') === '4 3 5', 'C: часы должны быть 4 3 5');
  check(gaps([0, 3, 7]).join(' ') === '3 4 5', 'Cm: часы должны быть 3 4 5');

  for (const type of CHORD_TYPES) {
    const total = gaps(type.semis).reduce((sum, gap) => sum + gap, 0);
    check(total === 12, `${type.name}: сумма часов ${total}, а не 12`);

    type.degrees.forEach((degree, i) => {
      const expected = LETTERS[degreeSteps(degree)] + degree.replace(/\d/g, '');
      check(spellTone('C', 0, degree, type.semis[i]) === expected,
        `${type.name}: ступень ${degree} не совпадает с ${type.semis[i]} полутонами`);
    });

    const minorThird = ['m', 'm7', 'm(maj7)', 'm(add9)', 'm9', 'dim'].includes(type.name);
    const blackRoots = useAlt => [1, 3, 6, 8, 10].map(pc => rootName(pc, type, useAlt)).join(' ');
    check(blackRoots(false) === (minorThird ? 'C# Eb F# G# Bb' : 'Db Eb F# Ab Bb'),
      `${type.name}: основные тоны ${blackRoots(false)}`);
    check(blackRoots(true) === (minorThird ? 'Db D# Gb Ab A#' : 'C# D# Gb G# A#'),
      `${type.name}: после ♯/♭ ${blackRoots(true)}`);

    for (let rootPc = 0; rootPc < 12; rootPc++) {
      for (const useAlt of [false, true]) {
        const notes = spellChord(rootName(rootPc, type, useAlt), type);
        check(!notes.some(n => /##|bb/.test(n)), `${notes[0]}${type.symbol}: двойной знак в ${notes.join(' ')}`);
      }
    }
  }

  console.log(failed ? `selfTest: ошибок — ${failed}` : 'selfTest: всё верно');
  return failed;
}
</script>

      '#5': 'увеличенная квинта (A5)',
      'b7': 'малая септима (m7)',
      '7': 'большая септима (M7)',
      '9': 'большая нона (M9)',
    },
    solfege: { C: 'до', D: 'ре', E: 'ми', F: 'фа', G: 'соль', A: 'ля', B: 'си' },
    clockSolfege: [
      'до', 'до♯/ре♭', 'ре', 'ре♯/ми♭', 'ми', 'фа',
      'фа♯/соль♭', 'соль', 'соль♯/ля♭', 'ля', 'ля♯/си♭', 'си',
    ],
  },
};

const PIANO_LOW = 48;
const PIANO_HIGH = 72;
const BLACK_PCS = [1, 3, 6, 8, 10];
const CENTER = 250;
const RING_RADIUS = 196;
const NODE_RADIUS = 31;
const WHITE_KEY = { width: 40, height: 124 };
const BLACK_KEY = { width: 24, height: 78 };

const state = {
  rootPc: 0,
  useAlt: false,
  type: CHORD_TYPES[0],
  compare: false,
  showSolfege: true,
  lang: navigator.language?.startsWith('ru') ? 'ru' : 'en',
};

const clockEl = document.getElementById('clock');
const pianoEl = document.getElementById('piano');
const symbolEl = document.getElementById('symbol');
const legendEl = document.getElementById('legend');
const tonesEl = document.getElementById('tones');
const helpEl = document.getElementById('help');
const enharmonicEl = document.getElementById('enharmonic');
const compareEl = document.getElementById('compare');
const compareLabelEl = document.getElementById('compare-label');
const solfegeToggleEl = document.getElementById('show-solfege');
const langButtons = [...document.querySelectorAll('.lang button')];

const typeButtons = CHORD_TYPES.map(type => {
  const button = document.createElement('button');
  button.textContent = type.name;
  button.addEventListener('click', () => {
    state.type = type;
    state.useAlt = false;
    render();
  });
  document.getElementById('types').append(button);
  return button;
});

function pretty(name) {
  return name.replace('#', '♯').replace('b', '♭');
}

function solfege(note) {
  return I18N[state.lang].solfege[note[0]] + pretty(note.slice(1));
}

function svgEl(tag, attrs, text) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
  if (text !== undefined) el.textContent = text;
  return el;
}

function clockPoint(pc) {
  const angle = (pc * Math.PI) / 6;
  return [CENTER + RING_RADIUS * Math.sin(angle), CENTER - RING_RADIUS * Math.cos(angle)];
}

function clockwisePcs(semis) {
  return semis.map(s => s % 12).sort((a, b) => a - b).map(s => (state.rootPc + s) % 12);
}

function shapePoints(pcs) {
  return pcs.map(pc => clockPoint(pc).join(',')).join(' ');
}

function currentChord() {
  const type = state.type;
  const root = rootName(state.rootPc, type, state.useAlt);
  const ghost = state.compare && canCompare(type) ? flipThird(type) : null;
  return {
    notes: spellChord(root, type),
    pcs: type.semis.map(s => (state.rootPc + s) % 12),
    midis: type.semis.map(s => {
      const midi = PIANO_LOW + state.rootPc + s;
      return midi > PIANO_HIGH ? midi - 12 : midi;
    }),
    ghost: ghost && { ...ghost, notes: spellChord(root, ghost) },
  };
}

function renderText() {
  const t = I18N[state.lang];
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t[el.dataset.i18n];
  });
  compareLabelEl.title = t.compareTitle;
  enharmonicEl.title = t.enharmonicTitle;
  helpEl.innerHTML = t.help.map(item => `<li>${item}</li>`).join('');
  langButtons.forEach(button => button.classList.toggle('active', button.dataset.lang === state.lang));
}

function renderClock(chord) {
  const ordered = clockwisePcs(state.type.semis);
  const ghostNames = {};
  clockEl.replaceChildren(
    svgEl('circle', { class: 'face', cx: CENTER, cy: CENTER, r: RING_RADIUS }),
    svgEl('polygon', { class: 'chord-shape', points: shapePoints(ordered) }),
  );
  if (chord.ghost) {
    clockEl.append(svgEl('polygon', { class: 'ghost', points: shapePoints(clockwisePcs(chord.ghost.semis)) }));
    chord.ghost.semis.forEach((s, i) => {
      ghostNames[(state.rootPc + s) % 12] = chord.ghost.notes[i];
    });
  }

  for (let pc = 0; pc < 12; pc++) {
    const [x, y] = clockPoint(pc);
    const toneIndex = chord.pcs.indexOf(pc);
    const role = pc === state.rootPc ? 'root' : toneIndex >= 0 ? 'tone' : 'off';
    const node = svgEl('g', { class: `node ${BLACK_PCS.includes(pc) ? 'black' : 'white'} ${role}` });
    const name = toneIndex >= 0 ? chord.notes[toneIndex] : ghostNames[pc] ?? rootName(pc, state.type, false);
    node.append(
      svgEl('circle', { cx: x, cy: y, r: NODE_RADIUS }),
      svgEl('text', { class: 'letter', x, y: state.showSolfege ? y - 5 : y }, pretty(name)),
    );
    if (state.showSolfege) {
      node.append(svgEl('text', { class: 'solf', x, y: y + 13 }, I18N[state.lang].clockSolfege[pc]));
    }
    node.addEventListener('click', () => selectRoot(pc));
    clockEl.append(node);
  }

  if (chord.ghost) {
    const third = chord.ghost.degrees.findIndex(d => d === '3' || d === 'b3');
    const [x, y] = clockPoint((state.rootPc + chord.ghost.semis[third]) % 12);
    clockEl.append(svgEl('circle', { class: 'ghost', cx: x, cy: y, r: NODE_RADIUS + 7 }));
  }

  gaps(state.type.semis).forEach((gap, i) => {
    const [x1, y1] = clockPoint(ordered[i]);
    const [x2, y2] = clockPoint(ordered[(i + 1) % ordered.length]);
    const x = (x1 + x2) / 2;
    const y = (y1 + y2) / 2;
    const label = svgEl('g', { class: 'gap' });
    label.append(svgEl('circle', { cx: x, cy: y, r: 11 }), svgEl('text', { x, y }, gap));
    clockEl.append(label);
  });
}

function renderInfo(chord) {
  const t = I18N[state.lang];
  const type = state.type;
  const defaultName = rootName(state.rootPc, type, false);
  const altName = ENHARMONIC[defaultName];
  symbolEl.textContent = pretty(chord.notes[0]) + type.symbol;
  enharmonicEl.disabled = !altName;
  enharmonicEl.textContent = altName ? `${pretty(defaultName)} ⇄ ${pretty(altName)}` : '♯ ⇄ ♭';

  legendEl.textContent = '';
  if (chord.ghost) {
    const ghostNotes = chord.ghost.notes;
    legendEl.textContent = `${t.dashed}: ${pretty(ghostNotes[0])}${chord.ghost.symbol} = ` +
      `${ghostNotes.map(pretty).join(' ')} · ${t.hours} ${gaps(chord.ghost.semis).join(' ')}`;
  }

  const row = (label, values, rowClass = '') =>
    `<tr class="${rowClass}"><th>${label}</th>` +
    values.map((value, i) => `<td class="${i === 0 ? 'root' : ''}">${value}</td>`).join('') +
    '</tr>';
  tonesEl.innerHTML = [
    row(t.rows.notes, chord.notes.map(pretty), 'notes'),
    state.showSolfege ? row(t.rows.solfege, chord.notes.map(solfege)) : '',
    row(t.rows.degrees, type.degrees.map(pretty)),
    row(t.rows.semis, type.semis),
    row(t.rows.intervals, type.degrees.map(d => t.intervals[d]), 'intervals'),
  ].join('');
}

function renderPiano(chord) {
  const whiteKeys = [];
  const blackKeys = [];
  let whiteIndex = 0;
  for (let midi = PIANO_LOW; midi <= PIANO_HIGH; midi++) {
    const isBlack = BLACK_PCS.includes(midi % 12);
    const role = midi === chord.midis[0] ? 'root' : chord.midis.includes(midi) ? 'tone' : '';
    const className = `key ${isBlack ? 'black' : 'white'} ${role}`;
    if (isBlack) {
      const x = whiteIndex * WHITE_KEY.width - BLACK_KEY.width / 2;
      blackKeys.push(svgEl('rect', { class: className, x, y: -5, width: BLACK_KEY.width, height: BLACK_KEY.height + 5, rx: 4 }));
      continue;
    }
    const x = whiteIndex * WHITE_KEY.width;
    whiteKeys.push(svgEl('rect', { class: className, x, y: -5, width: WHITE_KEY.width, height: WHITE_KEY.height + 5, rx: 5 }));
    if (midi % 12 === 0) {
      const label = `C${Math.floor(midi / 12) - 2}`;
      whiteKeys.push(svgEl('text', { class: 'key-label', x: x + WHITE_KEY.width / 2, y: WHITE_KEY.height - 10 }, label));
    }
    whiteIndex++;
  }
  pianoEl.replaceChildren(...whiteKeys, ...blackKeys);
}

function render() {
  const chord = currentChord();
  renderText();
  typeButtons.forEach((button, i) => button.classList.toggle('active', CHORD_TYPES[i] === state.type));
  compareEl.checked = state.compare;
  compareEl.disabled = !canCompare(state.type);
  solfegeToggleEl.checked = state.showSolfege;
  renderClock(chord);
  renderInfo(chord);
  renderPiano(chord);
}

let audioContext = null;
let masterGain = null;
let activeBus = null;

function audio() {
  if (!audioContext) {
    audioContext = new AudioContext();
    masterGain = audioContext.createGain();
    masterGain.gain.value = 0.35;
    masterGain.connect(audioContext.destination);
  }
  if (audioContext.state === 'suspended') audioContext.resume();
  return audioContext;
}

function midiToHz(midi) {
  return 440 * 2 ** ((midi - 69) / 12);
}

function playVoice(ctx, output, midi, start) {
  const osc = ctx.createOscillator();
  const env = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = midiToHz(midi);
  env.gain.setValueAtTime(0, start);
  env.gain.linearRampToValueAtTime(0.22, start + 0.015);
  env.gain.exponentialRampToValueAtTime(0.12, start + 0.4);
  env.gain.setValueAtTime(0.12, start + 1);
  env.gain.exponentialRampToValueAtTime(0.0001, start + 2.4);
  osc.connect(env).connect(output);
  osc.start(start);
  osc.stop(start + 2.45);
}

function playNotes(midis, spacing) {
  const ctx = audio();
  const now = ctx.currentTime;
  if (activeBus) {
    const previous = activeBus;
    previous.gain.setValueAtTime(1, now);
    previous.gain.linearRampToValueAtTime(0, now + 0.08);
    setTimeout(() => previous.disconnect(), 200);
  }
  activeBus = ctx.createGain();
  activeBus.connect(masterGain);
  midis.forEach((midi, i) => playVoice(ctx, activeBus, midi, now + 0.03 + i * spacing));
}

function selectRoot(pc) {
  if (pc !== state.rootPc) {
    state.rootPc = pc;
    state.useAlt = false;
  }
  render();
  playNotes([PIANO_LOW + pc], 0);
}

langButtons.forEach(button => button.addEventListener('click', () => {
  state.lang = button.dataset.lang;
  render();
}));
enharmonicEl.addEventListener('click', () => {
  state.useAlt = !state.useAlt;
  render();
});
compareEl.addEventListener('change', () => {
  state.compare = compareEl.checked;
  render();
});
solfegeToggleEl.addEventListener('change', () => {
  state.showSolfege = solfegeToggleEl.checked;
  render();
});
document.getElementById('play').addEventListener('click', () => playNotes(currentChord().midis, 0));
document.getElementById('arpeggio').addEventListener('click', () => {
  playNotes(currentChord().midis.sort((a, b) => a - b), 0.2);
});

selfTest();
render();
</script>
</body>
</html>
